<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FPRS - Financial Product Rating System</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
body{font-family:'Heebo',sans-serif;background:#080e1f;color:#e2e8f0}
.card{background:rgba(17,27,46,0.9);border:1px solid #1e2d4a;border-radius:20px}
.gold{background:linear-gradient(135deg,#fbbf24,#f59e0b,#d97706);box-shadow:0 0 20px rgba(251,191,36,0.3)}
.search{background:#0f172a;border:1px solid #1e293b}
th{color:#94a3b8;font-size:11px;white-space:nowrap;text-transform:uppercase}
td{border-top:1px solid rgba(30,45,74,0.5)}
.star-on{color:#fbbf24;text-shadow:0 0 8px rgba(251,191,36,0.5)}.star-off{color:#1e293b}
.decay-red{background:rgba(239,68,68,0.1);color:#fca5a5;border:1px solid rgba(239,68,68,0.3)}
.decay-orange{background:rgba(249,115,22,0.1);color:#fdba74;border:1px solid rgba(249,115,22,0.3)}
.decay-green{background:rgba(16,185,129,0.1);color:#6ee7b7;border:1px solid rgba(16,185,129,0.3)}
.progress{height:6px;border-radius:999px;background:#1e293b;overflow:hidden}
</style>
</head>
<body class="p-4 md:p-6">
<div class="max-w- mx-auto">
<div class="flex justify-between items-center mb-8">
<div class="flex items-center gap-5">
<div class="w-14 h-14 gold rounded-2xl flex items-center justify-center font-black text-black text-">FPRS</div>
<div>
<h1 class="text- font-black text-white leading-none">FPRS</h1>
<p class="text- tracking-[0.2em] text-amber-200/80 uppercase">Financial Product Rating System</p>
<p class="text- text-slate-400">מערכת דירוג קרנות נאמנות • 4 מנועי AI • מתעדכן יומית</p>
</div>
</div>
<div class="flex gap-3">
<div class="card px-5 py-3 text-center"><div class="text- text-slate-400">סה"כ קרנות</div><div id="totalFunds" class="font-black text-white text-xl">-</div><div class="text- text-emerald-400">● חיות</div></div>
<div class="card px-5 py-3 text-center"><div class="text- text-slate-400">ממוצע ציון</div><div class="font-black text-white text-xl"><span id="avgScore">-</span> /100</div></div>
<div class="card px-5 py-3 text-center"><div class="text- text-slate-400">עדכון</div><div class="font-bold text-white text-sm">14.9.2026</div></div>
</div>
</div>
<div class="card p-5 mb-5">
<div class="flex gap-3 flex-wrap">
<input id="searchInput" placeholder="חיפוש לפי שם קרן..." class="search flex-1 rounded-xl px-5 py-3 text-sm outline-none">
<select id="categoryFilter" class="search rounded-xl px-5 py-3 text-sm"><option value="">כל הקטגוריות</option></select>
<select id="starsFilter" class="search rounded-xl px-4 py-3 text-sm"><option value="">כל הדירוגים</option><option value="5">5 כוכבים</option><option value="4">4 כוכבים</option><option value="3">3 כוכבים</option><option value="2">2 כוכבים</option><option value="1">1 כוכב</option></select>
</div>
<div class="mt-4 flex gap-2 text-"><span class="px-3 py-1 rounded-full decay-red">● שחיקה בקרן 1-2★</span><span class="px-3 py-1 rounded-full decay-orange">● יציב 3★</span><span class="px-3 py-1 rounded-full decay-green">● מומנטום חזק 4-5★</span></div>
</div>
<div class="card overflow-hidden"><div class="overflow-auto max-h-"><table class="w-full text-"><thead class="sticky top-0 bg-[#0f1a30] z-10"><tr class="text-right border-b border-slate-700/50"><th class="p-4">דירוג</th><th class="p-4">שם קרן</th><th class="p-4">קטגוריה</th><th class="p-4">ציון</th><th class="p-4">איכות</th><th class="p-4">★ כוכבים</th><th class="p-4">תשואה 1M</th><th class="p-4">תשואה 12M</th><th class="p-4">תשואה 36M</th><th class="p-4">Sharpe 1Y</th><th class="p-4">Sharpe 3Y</th><th class="p-4">סטטוס</th></tr></thead><tbody id="fundsBody"></tbody></table></div></div>
</div>
<script>
let allFunds=[];
async function load(){let r=await fetch('./funds.json?v='+Date.now());let d=await r.json();if(d.funds)d=d.funds;allFunds=d;document.getElementById('totalFunds').textContent=allFunds.length;let avg=allFunds.reduce((s,f)=>s+(f.score||0),0)/allFunds.length;document.getElementById('avgScore').textContent=avg.toFixed(1);let cats=[...new Set(allFunds.map(f=>f.category))].sort();let sel=document.getElementById('categoryFilter');cats.forEach(c=>{let o=document.createElement('option');o.value=c;o.textContent=c;sel.appendChild(o);});render(allFunds);}
function starsHtml(n){n=Math.round(Number(n)||0);let s='';for(let i=1;i<=5;i++)s+=`<span class="${i<=n?'star-on':'star-off'}">★</span>`;return s;}
function fmt(v,suf=''){if(v==null||v==='')return '—';let num=Number(v);if(isNaN(num))return '—';return num.toFixed(2)+suf;}
function badge(score){score=Number(score)||0;if(score>=85)return `<span class="px-3 py-1 rounded-full text- font-bold" style="background:#064e3b;color:#6ee7b7;border:1px solid #10b981">מצוינת</span>`;if(score>=70)return `<span class="px-3 py-1 rounded-full text- font-bold" style="background:#422006;color:#fcd34d;border:1px solid #f59e0b">טובה</span>`;if(score>=50)return `<span class="px-3 py-1 rounded-full text-" style="background:#1e293b;color:#94a3b8">בינונית</span>`;return `<span class="px-3 py-1 rounded-full text- font-bold" style="background:#450a0a;color:#fca5a5;border:1px solid #ef4444">חלשה</span>`;}
function statusBadge(stars){stars=Math.round(Number(stars)||0);if(stars<=2)return `<span class="px-3 py-1.5 rounded-full text- font-bold decay-red">● שחיקה בקרן</span>`;if(stars===3)return `<span class="px-3 py-1.5 rounded-full text- font-bold decay-orange">● יציב</span>`;return `<span class="px-3 py-1.5 rounded-full text- font-bold decay-green">● מומנטום חזק</span>`;}
function render(list){let b=document.getElementById('fundsBody');b.innerHTML='';list.slice(0,600).forEach(f=>{let tr=document.createElement('tr');tr.className='hover:bg-[#16223a]/80';tr.innerHTML=`<td class="p-4"><div class="w-8 h-8 rounded-full ${f.rank<=3?'gold text-black':'bg-slate-800'} flex items-center justify-center font-black text-xs">${f.rank}</div></td><td class="p-4"><div class="font-bold text-white max-w- truncate">${f.name}</div><div class="text- text-slate-500">#${f.id}</div></td><td class="p-4"><span class="px-3 py-1 rounded-full bg-slate-800 border border-slate-700 text-">${f.category}</span></td><td class="p-4 font-black text-white">${Number(f.score).toFixed(1)}</td><td class="p-4">${badge(f.score)}</td><td class="p-4">${starsHtml(f.stars)} <span class="text- text-slate-500">(${f.stars})</span></td><td class="p-4 font-mono ${Number(f.return_1m)>=0?'text-emerald-400':'text-red-400'}">${fmt(f.return_1m,'%')}</td><td class="p-4 font-mono font-bold ${Number(f.return_1y)>=0?'text-emerald-400':'text-red-400'}">${fmt(f.return_1y,'%')}</td><td class="p-4 font-mono ${Number(f.return_3y)>=0?'text-emerald-400':'text-red-400'}">${fmt(f.return_3y,'%')}</td><td class="p-4 font-mono">${fmt(f.sharpe_1y)}</td><td class="p-4 font-mono">${fmt(f.sharpe_3y)}</td><td class="p-4">${statusBadge(f.stars)}</td>`;b.appendChild(tr);});}
document.getElementById('searchInput').addEventListener('input',e=>{let q=e.target.value.toLowerCase();render(allFunds.filter(f=>f.name.toLowerCase().includes(q)));});
load();
</script>
</body>
</html>
