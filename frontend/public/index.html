<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FPRS - Financial Product Rating System</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{font-family:'Heebo',sans-serif}
body{background:#fcfcff}
.header-main{background:linear-gradient(135deg,#0f0a3c 0%,#2d1b69 40%,#4c1d95 75%,#5b21b6 100%)}
.card-white{background:#ffffff;border:1px solid #ede9fe;box-shadow:0 10px 40px rgba(76,29,149,0.08);border-radius:20px}
.status-green{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0;font-weight:700}
.status-orange{background:#fffbeb;color:#92400e;border:1px solid #fde68a;font-weight:700}
.status-red{background:#fef2f2;color:#991b1b;border:1px solid #fecaca;font-weight:700}
.star-on{color:#f59e0b;filter:drop-shadow(0 0 4px rgba(245,158,11,0.4))}.star-off{color:#e9e5ff}
th{background:linear-gradient(to bottom,#faf5ff,#f5f3ff);color:#6d28d9;font-weight:700;font-size:11px}
tr:hover{background:#faf5ff}
</style>
</head>
<body>
<div class="header-main text-white">
<div class="max-w- mx-auto px-8 py-6 flex justify-between items-center">
<div class="flex items-center gap-5">
<img src="./logo.jpg" onerror="this.style.display='none'" class="w-14 h-14 rounded-2xl object-contain bg-white p-2 shadow-2xl">
<div>
<h1 class="text- font-extrabold leading-none">FPRS</h1>
<p class="text- tracking-[0.25em] text-violet-200 font-medium mt-1">FINANCIAL PRODUCT RATING SYSTEM</p>
<p class="text- text-violet-100/80 font-light mt-1">מערכת דירוג קרנות נאמנות • 4 מנועי AI</p>
</div>
</div>
<div class="text-left">
<div class="text- text-violet-200/80">מתעדכן יומית • <span id="totalCount" class="text-white font-bold">-</span> קרנות</div>
</div>
</div>
</div>

<div class="max-w- mx-auto p-6">
<div class="card-white p-2 flex gap-2 mb-6">
<div class="flex-1 relative">
<span class="absolute right-4 top-1/2 -translate-y-1/2 text-violet-400">🔍</span>
<input id="searchInput" placeholder="חיפוש לפי שם קרן או מספר קרן..." class="w-full bg-slate-50 border-2 border-violet-100 rounded-xl pr-12 pl-5 py-3.5 text- font-medium focus:border-violet-400 outline-none">
</div>
<select id="categoryFilter" class="bg-slate-50 border-2 border-violet-100 rounded-xl px-6 py-3.5 text- font-bold text-violet-900 min-w-"><option value="">כל הקטגוריות</option></select>
</div>

<div class="card-white overflow-hidden"><div class="overflow-auto max-h-"><table class="w-full"><thead class="sticky top-0 z-10"><tr class="text-right"><th class="p-4">#</th><th class="p-4">מס' קרן</th><th class="p-4">שם קרן</th><th class="p-4">קטגוריה</th><th class="p-4">ציון</th><th class="p-4">דירוג</th><th class="p-4">1M</th><th class="p-4">12M</th><th class="p-4">36M</th><th class="p-4">Sharpe</th><th class="p-4">סטטוס</th></tr></thead><tbody id="fundsBody"></tbody></table></div></div>
</div>

<script>
let allFunds=[];
async function load(){let r=await fetch('./funds.json?v='+Date.now());let d=await r.json();if(d.funds)d=d.funds;allFunds=d;document.getElementById('totalCount').textContent=d.length;let cats=[...new Set(d.map(f=>f.category).filter(Boolean))].sort();let sel=document.getElementById('categoryFilter');cats.forEach(c=>{let o=document.createElement('option');o.value=c;o.textContent=c;sel.appendChild(o);});render(d);}
function cleanNumber(v){if(v==null)return null;if(typeof v==='string'&&v.toLowerCase()==='nan')return null;let n=Number(v);return isNaN(n)?null:n;}
function getStars(f){let n=cleanNumber(f.stars);if(n!=null)return Math.max(1,Math.min(5,Math.round(n)));let s=cleanNumber(f.score)||0;if(s>=85)return 5;if(s>=70)return 4;if(s>=50)return 3;if(s>=30)return 2;return 1;}
function getField(f,names){for(let k of names){if(f[k]!=null&&String(f[k]).toLowerCase()!=='nan'&&f[k]!=='')return f[k];}return null;}
function fmtPct(v){let n=cleanNumber(v);if(n==null)return '—';return (n>0?'+':'')+n.toFixed(2)+'%';}
function fmtSharpe(v){let n=cleanNumber(v);if(n==null)return '—';return n.toFixed(2);}
function render(list){let b=document.getElementById('fundsBody');b.innerHTML='';list.slice(0,800).forEach(f=>{let stars=getStars(f);let r1=getField(f,['return_1m','ret_1m','1m']);let r12=getField(f,['return_12m','return_1y','12m']);let r36=getField(f,['return_36m','return_3y','36m']);let sh=getField(f,['sharpe_1y','sharpe']);let status=stars>=4?{cls:'status-green',label:'מומנטום חיובי'}:stars===3?{cls:'status-orange',label:'יציב'}:{cls:'status-red',label:'שחיקה בקרן'};let starsHtml='';for(let i=1;i<=5;i++)starsHtml+=`<span class="${i<=stars?'star-on':'star-off'}">★</span>`;let tr=document.createElement('tr');tr.innerHTML=`<td class="p-4 text-slate-400 font-bold">${f.rank||''}</td><td class="p-4 font-mono font-extrabold text-violet-900">${f.id||''}</td><td class="p-4 font-semibold max-w- truncate">${f.name||''}</td><td class="p-4"><span class="px-3 py-1 rounded-full bg-violet-100 text-violet-800 text- font-bold">${f.category||''}</span></td><td class="p-4 font-extrabold text-">${cleanNumber(f.score)!=null?cleanNumber(f.score).toFixed(1):'—'}</td><td class="p-4">${starsHtml}<span class="text- font-bold text-slate-600 mr-1 bg-slate-100 px-1.5 py-0.5 rounded">${stars}</span></td><td class="p-4 font-bold ${cleanNumber(r1)>=0?'text-emerald-600':'text-red-600'}">${fmtPct(r1)}</td><td class="p-4 font-extrabold ${cleanNumber(r12)>=0?'text-emerald-600':'text-red-600'}">${fmtPct(r12)}</td><td class="p-4 font-bold ${cleanNumber(r36)>=0?'text-emerald-600':'text-red-600'}">${fmtPct(r36)}</td><td class="p-4 font-bold bg-slate-50 rounded-lg">${fmtSharpe(sh)}</td><td class="p-4"><span class="px-4 py-2 rounded-full text- ${status.cls}">${status.label}</span></td>`;b.appendChild(tr);});}
document.getElementById('searchInput').addEventListener('input',e=>{let q=e.target.value.toLowerCase();render(allFunds.filter(f=>(f.name&&f.name.toLowerCase().includes(q))||String(f.id).includes(q)));});
document.getElementById('categoryFilter').addEventListener('change',e=>{let v=e.target.value;render(v?allFunds.filter(f=>f.category===v):allFunds);});
load();
</script>
</body>
</html>
