<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FPRS</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800&display=swap" rel="stylesheet">
<style>body{font-family:'Heebo',sans-serif;background:#0a1020;color:#e2e8f0}.card{background:#111b2e;border:1px solid #1e2d4a;border-radius:16px}.gold{background:linear-gradient(135deg,#fbbf24,#f59e0b)}.search{background:#0f172a;border:1px solid #1e293b}th{color:#94a3b8;font-size:12px;white-space:nowrap}td{border-top:1px solid #1e293b}.star-on{color:#fbbf24}.star-off{color:#334155}</style>
</head>
<body class="p-4">
<div class="max-w- mx-auto">
<div class="card p-4 mb-4 flex gap-3"><input id="searchInput" placeholder="חיפוש..." class="search flex-1 rounded-xl px-4 py-2.5 text-sm"><select id="categoryFilter" class="search rounded-xl px-4 py-2.5 text-sm"><option value="">כל הקטגוריות</option></select></div>
<div class="card overflow-auto"><table class="w-full text-sm"><thead class="bg-[#111b2e]"><tr><th class="p-3">דירוג</th><th class="p-3">שם קרן</th><th class="p-3">קטגוריה</th><th class="p-3">ציון</th><th class="p-3">איכות</th><th class="p-3">★ כוכבים</th><th class="p-3">תשואה 1M</th><th class="p-3">תשואה 12M</th><th class="p-3">תשואה 36M</th><th class="p-3">Sharpe 1Y</th><th class="p-3">Sharpe 3Y</th><th class="p-3">DECAY</th></tr></thead><tbody id="fundsBody"></tbody></table></div>
</div>
<script>
let allFunds=[];async function load(){let r=await fetch('./funds.json?v='+Date.now());let d=await r.json();if(d.funds)d=d.funds;allFunds=d;render(allFunds);}
function stars(n){n=Math.round(Number(n)||0);let s='';for(let i=1;i<=5;i++)s+=`<span class="${i<=n?'star-on':'star-off'}">★</span>`;return s;}
function fmt(v,s=''){if(v==null||v==='')return '—';let n=Number(v);if(isNaN(n))return '—';return n.toFixed(2)+s;}
function render(list){let b=document.getElementById('fundsBody');b.innerHTML='';list.slice(0,500).forEach(f=>{let tr=document.createElement('tr');tr.innerHTML=`<td class="p-3">${f.rank}</td><td class="p-3 font-bold text-white">${f.name}</td><td class="p-3">${f.category}</td><td class="p-3">${Number(f.score).toFixed(2)}</td><td class="p-3">${f.quality_label}</td><td class="p-3">${stars(f.stars)}</td><td class="p-3 font-mono ${Number(f.return_1m)>=0?'text-emerald-400':'text-red-400'}">${fmt(f.return_1m,'%')}</td><td class="p-3 font-mono ${Number(f.return_1y)>=0?'text-emerald-400':'text-red-400'}">${fmt(f.return_1y,'%')}</td><td class="p-3 font-mono ${Number(f.return_3y)>=0?'text-emerald-400':'text-red-400'}">${fmt(f.return_3y,'%')}</td><td class="p-3 font-mono">${fmt(f.sharpe_1y)}</td><td class="p-3 font-mono">${fmt(f.sharpe_3y)}</td><td class="p-3">${f.is_decay?'⚠':''}</td>`;b.appendChild(tr);});}
document.getElementById('searchInput').addEventListener('input',e=>{let q=e.target.value.toLowerCase();render(allFunds.filter(f=>f.name.toLowerCase().includes(q)));});
load();
</script>
</body>
</html>
